<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCodeCamp — Полный курс Python</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a23;
    --bg-2: #1b1b32;
    --bg-3: #2a2a40;
    --accent: #f1be32;
    --accent-2: #dfd045;
    --text: #ffffff;
    --text-dim: #b3b3c9;
    --success: #acd157;
    --error: #ff6b6b;
    --border: #3d3d5c;
    --code-bg: #0d0d1f;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
  }
  header {
    background: var(--bg-2);
    border-bottom: 2px solid var(--accent);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 100;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: 700;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--bg);
    font-weight: 900;
    font-size: 20px;
  }
  .logo span { color: var(--accent); }
  .progress-bar {
    flex: 1;
    max-width: 400px;
    margin: 0 24px;
    height: 10px;
    background: var(--bg-3);
    border-radius: 5px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--success));
    transition: width 0.5s;
    width: 0%;
  }
  .progress-text {
    color: var(--text-dim);
    font-size: 14px;
    min-width: 80px;
    text-align: right;
  }
  .container {
    display: flex;
    height: calc(100vh - 64px);
  }
  aside {
    width: 300px;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 0;
  }
  aside::-webkit-scrollbar { width: 8px; }
  aside::-webkit-scrollbar-track { background: var(--bg-2); }
  aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .module-title {
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }
  .module-title:first-child { border-top: none; margin-top: 0; }
  .lesson-item {
    padding: 10px 20px 10px 32px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  .lesson-item:hover {
    background: var(--bg-3);
    color: var(--text);
  }
  .lesson-item.active {
    background: var(--bg-3);
    color: var(--accent);
    border-left-color: var(--accent);
    font-weight: 600;
  }
  .lesson-item.completed::before {
    content: '✓';
    color: var(--success);
    font-weight: 900;
  }
  .lesson-item:not(.completed)::before {
    content: '○';
    color: var(--text-dim);
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .lesson-content {
    flex: 1;
    overflow-y: auto;
    padding: 32px 48px;
    max-width: 100%;
  }
  .lesson-content::-webkit-scrollbar { width: 10px; }
  .lesson-content::-webkit-scrollbar-track { background: var(--bg); }
  .lesson-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  .lesson-header {
    border-bottom: 2px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 24px;
  }
  .lesson-module {
    color: var(--accent);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .lesson-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .lesson-meta {
    color: var(--text-dim);
    font-size: 13px;
  }
  .theory {
    line-height: 1.7;
    font-size: 16px;
    color: #e0e0f0;
  }
  .theory p { margin-bottom: 16px; }
  .theory h3 {
    color: var(--accent);
    margin: 24px 0 12px;
    font-size: 20px;
  }
  .theory ul, .theory ol {
    margin: 12px 0 16px 24px;
  }
  .theory li { margin-bottom: 6px; }
  .theory code {
    background: var(--code-bg);
    padding: 2px 8px;
    border-radius: 4px;
    color: var(--accent-2);
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 14px;
  }
  .theory pre {
    background: var(--code-bg);
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 16px 0;
    border-left: 3px solid var(--accent);
  }
  .theory pre code {
    background: transparent;
    padding: 0;
    color: #e0e0f0;
    font-size: 14px;
    line-height: 1.5;
  }
  .task-box {
    background: var(--bg-3);
    border: 2px solid var(--accent);
    border-radius: 8px;
    padding: 20px;
    margin: 24px 0;
  }
  .task-box h3 {
    color: var(--accent);
    margin-bottom: 12px;
    font-size: 18px;
  }
  .task-box ul { margin: 12px 0 0 24px; }
  .task-box li { margin-bottom: 8px; }
  .editor-section {
    background: var(--bg-2);
    border-top: 2px solid var(--border);
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .editor-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .editor-label {
    color: var(--accent);
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .editor-buttons { display: flex; gap: 10px; }
  button {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
  }
  button:hover { background: var(--accent-2); transform: translateY(-1px); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  button.secondary {
    background: transparent;
    color: var(--accent);
    border: 2px solid var(--accent);
  }
  button.secondary:hover { background: var(--accent); color: var(--bg); }
  button.success {
    background: var(--success);
    color: var(--bg);
  }
  #code-editor {
    background: var(--code-bg);
    color: #e0e0f0;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 14px;
    line-height: 1.6;
    min-height: 180px;
    resize: vertical;
    outline: none;
    tab-size: 4;
    width: 100%;
  }
  #code-editor:focus { border-color: var(--accent); }
  .console {
    background: #000;
    color: #0f0;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 13px;
    min-height: 80px;
    max-height: 200px;
    overflow-y: auto;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .console.error { color: var(--error); }
  .console.success { color: var(--success); }
  .console-line { margin-bottom: 2px; }
  .loading {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    gap: 20px;
  }
  .spinner {
    width: 60px; height: 60px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: var(--accent); font-size: 18px; }
  .loading-sub { color: var(--text-dim); font-size: 14px; }
  .hint {
    background: var(--bg-3);
    border-left: 3px solid var(--accent);
    padding: 12px 16px;
    margin: 16px 0;
    border-radius: 4px;
    font-size: 14px;
    color: var(--text-dim);
  }
  .hint strong { color: var(--accent); }
  .reset-btn {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 6px 12px;
    font-size: 12px;
  }
  .reset-btn:hover { color: var(--text); border-color: var(--text-dim); background: transparent; }
  @media (max-width: 900px) {
    aside { width: 240px; }
    .lesson-content { padding: 20px; }
    .progress-bar { display: none; }
  }
  @media (max-width: 600px) {
    aside { display: none; }
    .lesson-content { padding: 16px; }
  }
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Загружаем PyCodeCamp...</div>
  <div class="loading-sub">Инициализация интерпретатора Python (Pyodide)</div>
</div>

<header>
  <div class="logo">
    <div class="logo-icon">Py</div>
    <div>Py<span>CodeCamp</span></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">0 / 0</div>
</header>

<div class="container">
  <aside id="sidebar"></aside>
  <main>
    <div class="lesson-content" id="lessonContent"></div>
    <div class="editor-section">
      <div class="editor-header">
        <div class="editor-label">🐍 Редактор кода</div>
        <div class="editor-buttons">
          <button class="reset-btn" onclick="resetCode()">↺ Сбросить</button>
          <button class="secondary" onclick="runCode()">▶ Запустить</button>
          <button class="success" onclick="checkSolution()">✓ Проверить</button>
        </div>
      </div>
      <textarea id="code-editor" spellcheck="false"></textarea>
      <div class="editor-header">
        <div class="editor-label">📟 Консоль вывода</div>
      </div>
      <div class="console" id="console">Нажмите "Запустить" чтобы выполнить код...</div>
    </div>
  </main>
</div>

<script>
// ============ СТРУКТУРА КУРСА ============
const course = {
  modules: [
    {
      title: "Модуль 1: Основы Python",
      lessons: [
        {
          id: "1-1",
          title: "Привет, Python!",
          theory: `
            <p><strong>Python</strong> — один из самых популярных языков программирования в мире. Он используется в веб-разработке, анализе данных, машинном обучении, автоматизации и многом другом.</p>
            <p>Первая программа на любом языке — это <code>Hello, World!</code>. В Python это делается одной строкой:</p>
            <pre><code>print("Hello, World!")</code></pre>
            <p>Функция <code>print()</code> выводит текст на экран. Текст (строка) заключается в кавычки — одинарные <code>'</code> или двойные <code>"</code>.</p>
            <div class="hint"><strong>💡 Факт:</strong> Python назван в честь комедийного шоу "Летающий цирк Монти Пайтона", а не в честь змеи.</div>
          `,
          task: "Выведите на экран фразу <code>Hello, Python!</code>",
          starter: '# Напишите ваш код здесь\n',
          check: (output) => output.trim() === "Hello, Python!"
        },
        {
          id: "1-2",
          title: "Переменные",
          theory: `
            <p><strong>Переменная</strong> — это именованная ячейка памяти для хранения данных. В Python не нужно указывать тип переменной — он определяется автоматически.</p>
            <pre><code>name = "Alice"
age = 25
height = 1.68
is_student = True

print(name)
print(age)</code></pre>
            <h3>Правила именования переменных:</h3>
            <ul>
              <li>Могут содержать буквы, цифры и символ подчёркивания <code>_</code></li>
              <li>Не могут начинаться с цифры</li>
              <li>Регистр имеет значение: <code>Name</code> и <code>name</code> — разные переменные</li>
              <li>Нельзя использовать зарезервированные слова (<code>if</code>, <code>for</code>, <code>class</code> и т.д.)</li>
            </ul>
            <h3>Типы данных:</h3>
            <ul>
              <li><code>int</code> — целые числа: <code>42</code></li>
              <li><code>float</code> — дробные числа: <code>3.14</code></li>
              <li><code>str</code> — строки: <code>"hello"</code></li>
              <li><code>bool</code> — логический тип: <code>True</code> или <code>False</code></li>
            </ul>
          `,
          task: "Создайте переменные <code>year</code> со значением <code>2026</code> и <code>month</code> со значением <code>10</code>. Выведите их сумму с помощью <code>print()</code>.",
          starter: '# Создайте переменные year и month\n# Выведите их сумму\n',
          check: (output) => output.trim() === "2036"
        },
        {
          id: "1-3",
          title: "Ввод данных",
          theory: `
            <p>Для получения данных от пользователя используется функция <code>input()</code>. Она всегда возвращает строку, поэтому числа нужно преобразовывать:</p>
            <pre><code>name = input("Как вас зовут? ")
age = int(input("Сколько вам лет? "))

print(f"Привет, {name}! Тебе {age} лет.")</code></pre>
            <h3>Преобразование типов:</h3>
            <ul>
              <li><code>int(x)</code> — в целое число</li>
              <li><code>float(x)</code> — в дробное число</li>
              <li><code>str(x)</code> — в строку</li>
            </ul>
            <h3>F-строки (форматирование):</h3>
            <p>Строки с префиксом <code>f</code> позволяют вставлять переменные прямо в текст:</p>
            <pre><code>x = 10
print(f"Значение x равно {x}")</code></pre>
          `,
          task: "Напишите программу, которая запрашивает у пользователя число и выводит его квадрат. Используйте <code>int(input())</code>.<br><br><em>Примечание: при проверке мы подадим число 5 на вход.</em>",
          starter: '# Получите число от пользователя и выведите его квадрат\n',
          check: (output) => output.trim() === "25",
          testInput: "5\n"
        }
      ]
    },
    {
      title: "Модуль 2: Операторы",
      lessons: [
        {
          id: "2-1",
          title: "Арифметические операторы",
          theory: `
            <p>Python поддерживает все стандартные математические операции:</p>
            <pre><code>a = 10
b = 3

print(a + b)   # Сложение: 13
print(a - b)   # Вычитание: 7
print(a * b)   # Умножение: 30
print(a / b)   # Деление: 3.333...
print(a // b)  # Целочисленное деление: 3
print(a % b)   # Остаток от деления: 1
print(a ** b)  # Возведение в степень: 1000</code></pre>
            <h3>Приоритет операций:</h3>
            <ol>
              <li><code>**</code> (степень)</li>
              <li><code>* / // %</code></li>
              <li><code>+ -</code></li>
            </ol>
            <p>Используйте скобки для изменения порядка: <code>(a + b) * 2</code></p>
          `,
          task: "Даны два числа: <code>a = 17</code> и <code>b = 5</code>. Выведите в отдельных строках: их сумму, произведение и остаток от деления a на b.",
          starter: 'a = 17\nb = 5\n# Выведите сумму, произведение и остаток\n',
          check: (output) => output.trim() === "22\n85\n2"
        },
        {
          id: "2-2",
          title: "Операторы сравнения",
          theory: `
            <p>Операторы сравнения возвращают <code>True</code> или <code>False</code>:</p>
            <pre><code>x = 10
y = 5

print(x == y)   # Равно: False
print(x != y)   # Не равно: True
print(x > y)    # Больше: True
print(x < y)    # Меньше: False
print(x >= 10)  # Больше или равно: True
print(x <= 5)   # Меньше или равно: False</code></pre>
            <h3>Логические операторы:</h3>
            <pre><code>a = True
b = False

print(a and b)  # И: False
print(a or b)   # ИЛИ: True
print(not a)    # НЕ: False</code></pre>
            <p>Операторы <code>and</code>, <code>or</code>, <code>not</code> используются для составления сложных условий.</p>
          `,
          task: "Переменная <code>age = 25</code>. Выведите <code>True</code>, если возраст от 18 до 65 включительно, и <code>False</code> иначе. Результат должен быть выведен через <code>print()</code>.",
          starter: 'age = 25\n# Выведите True или False\n',
          check: (output) => output.trim() === "True"
        }
      ]
    },
    {
      title: "Модуль 3: Условия",
      lessons: [
        {
          id: "3-1",
          title: "if, elif, else",
          theory: `
            <p>Условные конструкции позволяют выполнять разный код в зависимости от условий:</p>
            <pre><code>age = 18

if age >= 18:
    print("Совершеннолетний")
elif age >= 14:
    print("Подросток")
else:
    print("Ребёнок")</code></pre>
            <h3>Важные правила:</h3>
            <ul>
              <li>После <code>if</code>, <code>elif</code>, <code>else</code> ставится двоеточие <code>:</code></li>
              <li>Код внутри блока выделяется <strong>4 пробелами</strong> (отступ)</li>
              <li><code>elif</code> и <code>else</code> необязательны</li>
            </ul>
            <h3>Вложенные условия:</h3>
            <pre><code>x = 10
if x > 0:
    if x % 2 == 0:
        print("Положительное чётное")
    else:
        print("Положительное нечётное")</code></pre>
          `,
          task: "Напишите программу, которая получает число от пользователя и выводит:<br>• <code>положительное</code> если число > 0<br>• <code>отрицательное</code> если число < 0<br>• <code>ноль</code> если число равно 0<br><br><em>На вход подаётся число -7.</em>",
          starter: 'n = int(input())\n# Ваш код\n',
          check: (output) => output.trim() === "отрицательное",
          testInput: "-7\n"
        },
        {
          id: "3-2",
          title: "Тернарный оператор",
          theory: `
            <p>В Python есть сокращённая запись условия — тернарный оператор:</p>
            <pre><code>age = 20
status = "взрослый" if age >= 18 else "ребёнок"
print(status)  # взрослый</code></pre>
            <p>Синтаксис: <code>результат_если_истина if условие else результат_если_ложь</code></p>
            <p>Это эквивалентно:</p>
            <pre><code>if условие:
    результат = значение1
else:
    результат = значение2</code></pre>
          `,
          task: "Переменная <code>n = 15</code>. Используя тернарный оператор, создайте переменную <code>result</code> со значением <code>\"чётное\"</code> или <code>\"нечётное\"</code>. Выведите её.",
          starter: 'n = 15\n# Используйте тернарный оператор\n',
          check: (output) => output.trim() === "нечётное"
        }
      ]
    },
    {
      title: "Модуль 4: Циклы",
      lessons: [
        {
          id: "4-1",
          title: "Цикл for",
          theory: `
            <p>Цикл <code>for</code> перебирает элементы последовательности:</p>
            <pre><code># Перебор списка
for fruit in ["яблоко", "банан", "вишня"]:
    print(fruit)

# Функция range()
for i in range(5):      # 0, 1, 2, 3, 4
    print(i)

for i in range(2, 8):   # 2, 3, 4, 5, 6, 7
    print(i)

for i in range(0, 10, 2):  # 0, 2, 4, 6, 8
    print(i)</code></pre>
            <h3>Функция range():</h3>
            <ul>
              <li><code>range(stop)</code> — от 0 до stop-1</li>
              <li><code>range(start, stop)</code> — от start до stop-1</li>
              <li><code>range(start, stop, step)</code> — с шагом step</li>
            </ul>
          `,

// ============ СОСТОЯНИЕ ПРИЛОЖЕНИЯ ============
let pyodide = null;
let currentLessonId = "1-1";
let completedLessons = JSON.parse(localStorage.getItem('pycodecamp_completed') || '[]');
let userCode = JSON.parse(localStorage.getItem('pycodecamp_code') || '{}');

// ============ ИНИЦИАЛИЗАЦИЯ PYODIDE ============
async function initPyodide() {
  try {
    pyodide = await loadPyodide();
    document.getElementById('loading').style.display = 'none';
    renderSidebar();
    loadLesson(currentLessonId);
    updateProgress();
  } catch (err) {
    document.querySelector('.loading-text').textContent = 'Ошибка загрузки Python';
    document.querySelector('.loading-sub').textContent = err.message;
  }
}

// ============ РЕНДЕРИНГ САЙДБАРА ============
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  let html = '';
  course.modules.forEach(mod => {
    html += `<div class="module-title">${mod.title}</div>`;
    mod.lessons.forEach(lesson => {
      const completed = completedLessons.includes(lesson.id) ? 'completed' : '';
      const active = lesson.id === currentLessonId ? 'active' : '';
      html += `<div class="lesson-item ${completed} ${active}" data-id="${lesson.id}" onclick="loadLesson('${lesson.id}')">${lesson.title}</div>`;
    });
  });
  sidebar.innerHTML = html;
}

// ============ ПОИСК УРОКА ============
function findLesson(id) {
  for (const mod of course.modules) {
    for (const lesson of mod.lessons) {
      if (lesson.id === id) return { lesson, moduleTitle: mod.title };
    }
  }
  return null;
}

// ============ ЗАГРУЗКА УРОКА ============
function loadLesson(id) {
  const found = findLesson(id);
  if (!found) return;
  const { lesson, moduleTitle } = found;
  currentLessonId = id;

  const content = document.getElementById('lessonContent');
  content.innerHTML = `
    <div class="lesson-header">
      <div class="lesson-module">${moduleTitle}</div>
      <h1 class="lesson-title">${lesson.title}</h1>
      <div class="lesson-meta">Урок ${id.replace('-', ' · ')}</div>
    </div>
    <div class="theory">${lesson.theory}</div>
    <div class="task-box">
      <h3>📝 Задание</h3>
      <p>${lesson.task}</p>
    </div>
  `;
  content.scrollTop = 0;

  const editor = document.getElementById('code-editor');
  editor.value = userCode[id] || lesson.starter;
  document.getElementById('console').textContent = 'Нажмите "Запустить" чтобы выполнить код...';
  document.getElementById('console').className = 'console';

  renderSidebar();
  saveState();
}

// ============ ВЫПОЛНЕНИЕ КОДА ============
async function runCode() {
  if (!pyodide) return;
  const code = document.getElementById('code-editor').value;
  const consoleEl = document.getElementById('console');
  consoleEl.textContent = '⏳ Выполняется...\n';
  consoleEl.className = 'console';

  pyodide.runPython(`
import sys
import io
sys.stdout = io.StringIO()
sys.stderr = io.StringIO()
`);

  try {
    const lesson = findLesson(currentLessonId).lesson;
    if (lesson.testInput) {
      pyodide.runPython(`
import sys
import io
sys.stdin = io.StringIO(${JSON.stringify(lesson.testInput)})
`);
    }
    await pyodide.runPythonAsync(code);
    const stdout = pyodide.runPython('sys.stdout.getvalue()');
    const stderr = pyodide.runPython('sys.stderr.getvalue()');
    let output = stdout;
    if (stderr) output += '\n' + stderr;
    consoleEl.textContent = output || '(нет вывода)';
    consoleEl.className = 'console';
  } catch (err) {
    consoleEl.textContent = '❌ Ошибка:\n' + err.message;
    consoleEl.className = 'console error';
  }
}

// ============ ПРОВЕРКА РЕШЕНИЯ ============
async function checkSolution() {
  if (!pyodide) return;
  const code = document.getElementById('code-editor').value;
  const consoleEl = document.getElementById('console');
  const lesson = findLesson(currentLessonId).lesson;

  consoleEl.textContent = '⏳ Проверяем решение...\n';
  consoleEl.className = 'console';

  pyodide.runPython(`
import sys
import io
sys.stdout = io.StringIO()
sys.stderr = io.StringIO()
`);

  try {
    if (lesson.testInput) {
      pyodide.runPython(`
import sys
import io
sys.stdin = io.StringIO(${JSON.stringify(lesson.testInput)})
`);
    }
    await pyodide.runPythonAsync(code);
    const output = pyodide.runPython('sys.stdout.getvalue()');

    if (lesson.check(output)) {
      consoleEl.textContent = '✅ Отлично! Задание выполнено верно!\n\nВаш вывод:\n' + output;
      consoleEl.className = 'console success';
      if (!completedLessons.includes(currentLessonId)) {
        completedLessons.push(currentLessonId);
        saveState();
        updateProgress();
        renderSidebar();
        // Автоматически переходим к следующему уроку через 1.5с
        setTimeout(() => {
          const nextId = getNextLessonId(currentLessonId);
          if (nextId) loadLesson(nextId);
        }, 1500);
      }
    } else {
      consoleEl.textContent = '❌ Пока неверно. Проверьте условие задачи.\n\nВаш вывод:\n' + output + '\n\nОжидалось:\n(см. задание)';
      consoleEl.className = 'console error';
    }
  } catch (err) {
    consoleEl.textContent = '❌ Ошибка выполнения:\n' + err.message;
    consoleEl.className = 'console error';
  }
}

// ============ СЛЕДУЮЩИЙ УРОК ============
function getNextLessonId(currentId) {
  let found = false;
  for (const mod of course.modules) {
    for (const lesson of mod.lessons) {
      if (found) return lesson.id;
      if (lesson.id === currentId) found = true;
    }
  }
  return null;
}

// ============ СБРОС КОДА ============
function resetCode() {
  const lesson = findLesson(currentLessonId).lesson;
  document.getElementById('code-editor').value = lesson.starter;
  saveState();
}

// ============ СОХРАНЕНИЕ СОСТОЯНИЯ ============
function saveState() {
  const code = document.getElementById('code-editor').value;
  userCode[currentLessonId] = code;
  localStorage.setItem('pycodecamp_completed', JSON.stringify(completedLessons));
  localStorage.setItem('pycodecamp_code', JSON.stringify(userCode));
}

// ============ ПРОГРЕСС ============
function updateProgress() {
  const total = course.modules.reduce((sum, m) => sum + m.lessons.length, 0);
  const completed = completedLessons.length;
  const percent = total > 0 ? (completed / total) * 100 : 0;
  document.getElementById('progressFill').style.width = percent + '%';
  document.getElementById('progressText').textContent = `${completed} / ${total}`;
}

// ============ ОБРАБОТЧИКИ ============
document.getElementById('code-editor').addEventListener('input', saveState);
document.getElementById('code-editor').addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = e.target.selectionStart;
    const end = e.target.selectionEnd;
    e.target.value = e.target.value.substring(0, start) + '    ' + e.target.value.substring(end);
    e.target.selectionStart = e.target.selectionEnd = start + 4;
    saveState();
  }
  // Ctrl+Enter для запуска
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    runCode();
  }
});

// Запуск
initPyodide();
</script>
